<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	// Font Settings
	<match target="font">
		<edit name="hintstyle" mode="assign">
			<const>hintfull</const>
		</edit>
	</match>
	<match target="font">
		<edit name="rgba" mode="assign">
			<const>rgb</const>
		</edit>
	</match>
	<match target="font">
		<edit name="lcdfilter" mode="assign">
			<const>lcdlight</const>
		</edit>
	</match>

	// Base Fonts
	<alias>
		<family>serif</family>
		<prefer>
			<family>FreeSerif</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>MS Sans Serif Raster</family>
			<family>Microsoft Sans Serif</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Fixedsys Excelsior</family>
		</prefer>
	</alias>
	
	// JP fallback fonts
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>MS Sans Serif Raster</string>
		</edit>
		<edit name="family" mode="prepend" binding="strong">
			<string>Microsoft Sans Serif</string>
		</edit>
		<edit name="family" mode="prepend" binding="strong">
			<string>MS UI Gothic</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>TerminalVector</string>
		</test>
		<edit name="family" mode="prepend" binding="strong">
			<string>TerminalVector</string>
		</edit>
		<edit name="family" mode="prepend" binding="strong">
			<string>TerminalJP</string>
		</edit>
	</match>

	// Resize JP fonts to 9px from 8px
	<match target="font">
		<test name="family">
			<string>MS UI Gothic</string>
		</test>
		<edit name="pixelsize" mode="assign">
			<times><name>pixelsize</name>, <double>1.125</double></times>
		</edit>
	</match>
	<match target="font">
		<test name="family">
			<string>TerminalJP</string>
		</test>
		<edit name="pixelsize" mode="assign">
			<times><name>pixelsize</name>, <double>1.125</double></times>
		</edit>
	</match>

	// Disable Anti-Aliasing
	<match target="font">
		<test name="family" compare="eq" qual="any">
			<string>MS Sans Serif Raster</string>
		</test>
		<edit name="antialias" mode="assign">
			<bool>false</bool>
		</edit>
		<test name="family" compare="eq" qual="any">
			<string>Microsoft Sans Serif</string>
		</test>
		<edit name="antialias" mode="assign">
			<bool>false</bool>
		</edit>
		<test name="family" compare="eq" qual="any">
			<string>TerminalVector</string>
		</test>
		<edit name="antialias" mode="assign">
			<bool>false</bool>
		</edit>
		<test name="family" compare="eq" qual="any">
			<string>MS UI Gothic</string>
		</test>
		<edit name="antialias" mode="assign">
			<bool>false</bool>
		</edit>
		<test name="family" compare="eq" qual="any">
			<string>TerminalJP</string>
		</test>
		<edit name="antialias" mode="assign">
			<bool>false</bool>
		</edit>
	</match>

	// Default Emoji Font
	<!-- Add generic family. -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>emoji</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Segoe UI Emoji</string>
		</edit>
	</match>

	<!-- This adds Noto Color Emoji as a final fallback font for the default font families. -->
	<match target="pattern">
	<test name="family"><string>sans</string></test>
	<edit name="family" mode="append"><string>Segoe UI Emoji</string></edit>
	</match>

	<match target="pattern">
	<test name="family"><string>serif</string></test>
	<edit name="family" mode="append"><string>Segoe UI Emoji</string></edit>
	</match>

	<match target="pattern">
	<test name="family"><string>sans-serif</string></test>
	<edit name="family" mode="append"><string>Segoe UI Emoji</string></edit>
	</match>

	<match target="pattern">
	<test name="family"><string>monospace</string></test>
	<edit name="family" mode="append"><string>Segoe UI Emoji</string></edit>
	</match>

	<!-- Block Symbola from the list of fallback fonts. -->
	<selectfont>
	<rejectfont>
	<pattern>
	<patelt name="family">
	    <string>Symbola</string>
	</patelt>
	</pattern>
	</rejectfont>
	</selectfont>

	<!-- Use Noto Color Emoji when other popular fonts are being specifically requested. -->
	<match target="pattern">
	<test qual="any" name="family"><string>Apple Color Emoji</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Segoe UI Emoji</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Segoe UI Symbol</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Android Emoji</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Twitter Color Emoji</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Twemoji</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Twemoji Mozilla</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>TwemojiMozilla</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>EmojiTwo</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Emoji Two</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>EmojiSymbols</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>

	<match target="pattern">
	<test qual="any" name="family"><string>Symbola</string></test>
	<edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
	</match>
</fontconfig>